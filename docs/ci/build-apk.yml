name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master", "android", "mobile" ]
  pull_request:
    branches: [ "main", "master", "android", "mobile" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f android/debug.keystore.base64 ]; then
            base64 -d android/debug.keystore.base64 > android/debug.keystore
          fi

      - name: Restore Google Services JSON
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            if [ -d app ]; then echo "$GOOGLE_SERVICES_BASE64" | base64 -d > app/google-services.json; fi
            if [ -d android/app ]; then echo "$GOOGLE_SERVICES_BASE64" | base64 -d > android/app/google-services.json; fi
          elif [ ! -f app/google-services.json ] && [ -f app/google-services.example.json ]; then
            cp app/google-services.example.json app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f android/gradlew ]; then
            cd android && ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartClass-Arena-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release and Upload APK (On Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          name: SmartClass Android Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
